<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notes')}"></head>
<body class="sdd-app">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container sdd-main">
    <div class="sdd-page-header">
        <div>
            <h1 class="h3 fw-semibold mb-1">Notes</h1>
            <p class="text-secondary mb-0">Titles and bodies are sealed with AES-256-GCM under a per-note key.
                Every edit re-encrypts the note with a fresh key.</p>
        </div>
        <button id="add-note-button" type="button" class="btn btn-primary" data-bs-toggle="modal"
                data-bs-target="#noteModal" data-sdd-note-new>
            <i class="bi bi-plus-lg me-1"></i>New note
        </button>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card sdd-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0" id="noteTable">
                <thead>
                <tr>
                    <th scope="col" class="w-25">Title</th>
                    <th scope="col">Note</th>
                    <th scope="col" class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(notes)}">
                    <td colspan="3" class="text-center text-secondary py-5">
                        <i class="bi bi-journal fs-3 d-block mb-2"></i>No notes yet.
                    </td>
                </tr>
                <tr th:each="note : ${notes}" class="note-row">
                    <td class="fw-medium note-title" th:text="${note.title}">Title</td>
                    <td class="text-secondary note-body sdd-pre" th:text="${note.body}">Body</td>
                    <td class="text-end text-nowrap">
                        <button type="button" class="btn btn-sm btn-outline-primary edit-note" data-bs-toggle="modal"
                                data-bs-target="#noteModal" th:disabled="${!note.readable}"
                                th:attr="data-sdd-id=${note.id},data-sdd-title=${note.title},data-sdd-body=${note.body}">
                            <i class="bi bi-pencil"></i><span class="d-none d-lg-inline ms-1">Edit</span></button>
                        <form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post" class="d-inline"
                              data-sdd-confirm="Delete this note?">
                            <button type="submit" class="btn btn-sm btn-outline-danger delete-note" title="Delete">
                                <i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal fade" id="noteModal" tabindex="-1" aria-labelledby="noteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" th:action="@{/notes}" method="post" id="note-form">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="noteModalLabel">Note</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="id" id="note-id">
                <div class="mb-3">
                    <label for="note-title" class="form-label">Title</label>
                    <input type="text" name="title" class="form-control" id="note-title" maxlength="120" required>
                </div>
                <div class="mb-1">
                    <label for="note-description" class="form-label">Note</label>
                    <textarea class="form-control" name="body" id="note-description" rows="6" maxlength="10000"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button id="note-save" type="submit" class="btn btn-primary"><i class="bi bi-lock me-1"></i>Encrypt and save</button>
            </div>
        </form>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
