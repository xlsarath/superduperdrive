<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Credentials')}"></head>
<body class="sdd-app">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container sdd-main">
    <div class="sdd-page-header">
        <div>
            <h1 class="h3 fw-semibold mb-1">Credentials</h1>
            <p class="text-secondary mb-0">Site, username and password are encrypted. The list shows only the stored
                ciphertext; a password is decrypted when you ask to reveal it.</p>
        </div>
        <button id="add-credential-button" type="button" class="btn btn-primary" data-bs-toggle="modal"
                data-bs-target="#credentialModal" data-sdd-credential-new>
            <i class="bi bi-plus-lg me-1"></i>New credential
        </button>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card sdd-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0" id="credentialTable">
                <thead>
                <tr>
                    <th scope="col">Site</th>
                    <th scope="col">Username</th>
                    <th scope="col">Password</th>
                    <th scope="col" class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(credentials)}">
                    <td colspan="4" class="text-center text-secondary py-5">
                        <i class="bi bi-key fs-3 d-block mb-2"></i>No credentials yet.
                    </td>
                </tr>
                <tr th:each="credential : ${credentials}" class="credential-row" th:attr="data-sdd-id=${credential.id}">
                    <td class="fw-medium credential-url" th:text="${credential.url}">example.com</td>
                    <td class="credential-username" th:text="${credential.username}">user</td>
                    <td>
                        <code class="sdd-cipher credential-password" th:text="${credential.passwordCiphertextPreview} + '…'"
                              title="AES-256-GCM ciphertext (Base64 prefix)">ciphertext</code>
                        <span class="sdd-revealed credential-revealed d-none"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <button type="button" class="btn btn-sm btn-outline-secondary reveal-credential"
                                th:disabled="${!credential.readable}"
                                th:attr="data-sdd-reveal-url=@{/credentials/{id}/reveal(id=${credential.id})}">
                            <i class="bi bi-eye"></i><span class="d-none d-lg-inline ms-1">Reveal</span></button>
                        <button type="button" class="btn btn-sm btn-outline-primary edit-credential" data-bs-toggle="modal"
                                data-bs-target="#credentialModal" th:disabled="${!credential.readable}"
                                th:attr="data-sdd-id=${credential.id},data-sdd-url=${credential.url},data-sdd-username=${credential.username}">
                            <i class="bi bi-pencil"></i><span class="d-none d-lg-inline ms-1">Edit</span></button>
                        <form th:action="@{/credentials/{id}/delete(id=${credential.id})}" method="post" class="d-inline"
                              data-sdd-confirm="Delete this credential?">
                            <button type="submit" class="btn btn-sm btn-outline-danger delete-credential" title="Delete">
                                <i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal fade" id="credentialModal" tabindex="-1" aria-labelledby="credentialModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" th:action="@{/credentials}" method="post" id="credential-form">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="credentialModalLabel">Credential</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="id" id="credential-id">
                <div class="mb-3">
                    <label for="credential-url" class="form-label">Site address</label>
                    <input type="text" name="url" class="form-control" id="credential-url" maxlength="2048"
                           placeholder="https://example.com" required>
                </div>
                <div class="mb-3">
                    <label for="credential-username" class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" id="credential-username" maxlength="256"
                           autocomplete="off" required>
                </div>
                <div class="mb-1">
                    <label for="credential-password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="credential-password" maxlength="1024"
                           autocomplete="new-password">
                    <div class="form-text" id="credential-password-help">Leave empty when editing to keep the current password.</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button id="credential-save" type="submit" class="btn btn-primary"><i class="bi bi-lock me-1"></i>Encrypt and save</button>
            </div>
        </form>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
