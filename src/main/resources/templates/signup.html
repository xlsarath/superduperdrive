<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body class="sdd-auth">
<main class="sdd-auth-shell">
    <aside th:replace="~{fragments/layout :: pqcPanel}"></aside>
    <section class="sdd-auth-main">
        <div class="sdd-auth-card sdd-auth-card-wide">
            <a th:href="@{/login}" class="small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to sign in</a>
            <h1 class="h3 fw-semibold mt-3 mb-1">Create your account</h1>
            <p class="text-secondary mb-4">We generate your X25519, ML-KEM-768 and ML-DSA-65 key pairs and lock
                them with your password, so a copy of the database or the file store alone reveals none of your content.</p>

            <form th:action="@{/signup}" th:object="${form}" method="post" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="inputFirstName" class="form-label">First name</label>
                        <input type="text" id="inputFirstName" th:field="*{firstName}" class="form-control"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" autocomplete="given-name">
                        <div class="invalid-feedback" th:errors="*{firstName}">Error</div>
                    </div>
                    <div class="col-md-6">
                        <label for="inputLastName" class="form-label">Last name</label>
                        <input type="text" id="inputLastName" th:field="*{lastName}" class="form-control"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" autocomplete="family-name">
                        <div class="invalid-feedback" th:errors="*{lastName}">Error</div>
                    </div>
                    <div class="col-12">
                        <label for="inputUsername" class="form-label">Username</label>
                        <input type="text" id="inputUsername" th:field="*{username}" class="form-control"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                               autocomplete="username" autocapitalize="none" spellcheck="false">
                        <div class="invalid-feedback" id="username-error" th:errors="*{username}">Error</div>
                    </div>
                    <div class="col-md-6">
                        <label for="inputPassword" class="form-label">Password</label>
                        <input type="password" id="inputPassword" th:field="*{password}" class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{password}">Error</div>
                        <div class="form-text">At least 12 characters. It protects your private keys.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="inputConfirmPassword" class="form-label">Confirm password</label>
                        <input type="password" id="inputConfirmPassword" th:field="*{confirmPassword}" class="form-control"
                               th:classappend="${#fields.hasErrors('passwordConfirmed')} ? 'is-invalid'"
                               autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{passwordConfirmed}">Error</div>
                    </div>
                </div>
                <button id="buttonSignUp" type="submit" class="btn btn-primary btn-lg w-100 mt-4">
                    <i class="bi bi-key me-1"></i>Generate keys and create account
                </button>
            </form>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
