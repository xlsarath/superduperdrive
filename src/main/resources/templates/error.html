<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title} ?: 'Something went wrong')}"></head>
<body class="sdd-auth">
<main class="container py-5">
    <div class="sdd-auth-card mx-auto text-center">
        <div class="display-6 fw-semibold text-secondary mb-2" th:text="${status}">500</div>
        <h1 class="h4 fw-semibold" id="error-title" th:text="${title} ?: 'Something went wrong'">Error</h1>
        <p class="text-secondary" th:text="${message} ?: 'The request could not be completed.'">Message</p>
        <a th:href="@{/files}" class="btn btn-primary mt-2">Back to my drive</a>
    </div>
</main>
</body>
</html>
